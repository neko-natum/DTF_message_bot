version: '3.4'

services:
  dtf_message_bot:
    image: ${DOCKER_REGISTRY-}dtfmessagebot
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - DTFMB_PersistentState__Directory=/state
      - DTFMB_Logging__Console__DisableColors=true
      - DTFMB_Osnova__Host=dtf
      - DTFMB_Osnova__Version=v1.9
      - DTFMB_Osnova__Token=TODO
    volumes:
      - state-volume:/state

volumes:
  state-volume: