name: Telegram notifications

on:
  push:
    branches: 
      - master
  pull_request:
    branches: 
      - master

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
    - name: Send
      uses: appleboy/telegram-action@v0.0.8
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
