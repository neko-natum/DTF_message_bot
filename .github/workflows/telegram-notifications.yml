name: Telegram notifications

on:
  push:
    branches: 
      - master
  pull_request:
    branches: 
      - master
      - prod

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
    - name: context dump
      run: echo $GITHUB_CONTEXT
    - name: Send master push notification
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      uses: appleboy/telegram-action@v0.0.8
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: ${{ format('<b>{0}</b> pushed to <b>master</b> - <i>{1}</i>', github.actor, join(github.event.commits.*.message, ', ')) }}
        format: html
    - name: Send new PR notification
      if: github.event.pull_request.base.ref == 'master' && github.event_name == 'pull_request' && github.event.action == 'opened'
      uses: appleboy/telegram-action@v0.0.8
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: ${{ format('New <a href=''{1}''>PR-{0}</a> by <b>{2}</b> - <i>{3}</i>', github.event.number, github.event.pull_request.url, github.actor, github.event.pull_request.title) }}
        format: html
    - name: Send prod PR notification
      if: github.event.pull_request.base.ref == 'prod' && github.event_name == 'pull_request' && github.event.action == 'opened'
      uses: appleboy/telegram-action@v0.0.8
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: ${{ format('New deploy <a href=''{1}''>PR-{0}</a> by <b>{2}</b> - <i>{3}</i>', github.event.number, github.event.pull_request.url, github.actor, github.event.pull_request.title) }}
        format: html
